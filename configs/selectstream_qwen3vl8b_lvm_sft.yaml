# SelectStream: Qwen3-VL-8B (Method-SFT)
model:
  model_name_or_path: "Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"
  trust_remote_code: true

vismem:
  short_invoke_token: "<ms_I>"
  short_end_token: "<ms_E>"
  long_invoke_token: "<ml_I>"
  long_end_token: "<ml_E>"

  query_len: 8
  short_mem_len: 8
  long_mem_len: 16

  query_builder:
    num_layers: 2
    num_heads: 8
    dropout: 0.0
    ff_mult: 4

  # Key switch: use method-style latent write memory
  former_backend: "lvm_sft"   # lora_llm | tiny_transformer | lvm_sft
  visual_feature_source: "projected"   # projected (Phi_v(x_t), paper) | last_hidden (legacy)

  # LVM write routing/gating
  lvm_num_slots: 256
  lvm_segment_len: 32
  lvm_tau_r: 0.75
  lvm_tau_s: 0.35
  lvm_gate_hidden: 256
  lvm_normalize_slot: true
  lvm_eviction_policy: "fifo"   # fifo | low_surprise | low_access
  lvm_readout_policy: "recent"  # recent | surprise | hybrid
  lvm_delta_t_scale: 32.0
  lvm_enable_graph_merge: true
  lvm_merge_similarity_weight: 1.0
  lvm_merge_surprise_weight: 0.5
  lvm_merge_access_weight: 0.25
  lvm_merge_recency_weight: 0.25
  lvm_segment_encoder_layers: 1
  lvm_segment_encoder_heads: 4
  lvm_segment_time_pos: true

  # SAW (Surprise-driven Adaptive Windowing)
  lvm_use_saw: true
  lvm_saw_lambda_attn: 0.5
  lvm_saw_ema_decay: 0.9
  lvm_saw_l_min: 8
  lvm_saw_l_max: 64
  lvm_saw_energy_budget: 8.0
  lvm_saw_recent_window: 64
  lvm_saw_quantile: 0.9
  lvm_saw_attn_groups: 32
  lvm_saw_use_attn_proxy: true

  # DMG + GAR
  method_enable_dmg_gar: true
  method_graph_budget: 64
  method_seed_topk: 16
  method_num_hops: 2
  method_evidence_tokens: 8
  method_eta_surprise_boost: 0.2
  method_span_penalty_weight: 0.05
  method_merge_penalty_weight: 0.05
  method_route_edge_weight: 0.1
  method_route_temperature: 1.0
  method_route_threshold: 0.0
  method_sim_topk: 4
  method_temporal_weight_c: 1.0
  method_gar_layers: 2
  method_spar_subgraph_weight: 1.0
  method_spar_redundancy_weight: 1.0
  method_redundancy_margin: 0.0

  # keep for compatibility when backend != lvm_sft
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]

training:
  seed: 42
  max_new_tokens: 256
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 4
  # Phase-2 friendly toggles (keep false by default).
  freeze_lvm_writer: false
  freeze_graph_reasoner: false
  beta_ret: 0.1
  gamma_spar: 0.05
  ret_id_weight: 1.0
  ret_time_weight: 1.0
  time_tolerance: 0.0
  evidence_topk: 8
